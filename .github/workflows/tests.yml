# Unit tests, type check and lint.
# Runs on every push to `develop`, on pull requests into `develop`/`master`,
# and is reused by the EAS build workflow before building `master`.
name: Testes

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
